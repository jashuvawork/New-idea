name: Deploy paper #676 full session

# Applies deploy/redeploy-paper-676-full.sh on EC2 (overlay + --paper + verify).
on:
  workflow_dispatch:
    inputs:
      no_loss_stops:
        description: "Pass --no-loss-stops to set-execution-mode (#858)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-pr-676-paper
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b
  PUBLIC_API_URL: https://api.jashuvatrade.xyz

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Verify GitHub AWS secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Redeploy paper #676 on EC2
        id: deploy
        run: |
          set -euo pipefail
          NO_LOSS="${{ inputs.no_loss_stops }}"
          REDEPLOY="sudo bash deploy/redeploy-paper-676-full.sh"
          if [ "$NO_LOSS" = "true" ]; then
            REDEPLOY="$REDEPLOY --no-loss-stops"
          fi
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --comment "Paper #676 full redeploy $(git rev-parse --short HEAD)" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"export HOME=/root\",
              \"export GIT_CONFIG_GLOBAL=/root/.gitconfig\",
              \"git config --global --add safe.directory /opt/nexusquant/New-idea\",
              \"cd /opt/nexusquant/New-idea\",
              \"git fetch origin main\",
              \"git checkout main\",
              \"git pull --ff-only origin main || git reset --hard origin/main\",
              \"$REDEPLOY\"
            ]" \
            --query Command.CommandId \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for SSM command
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.deploy.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query StandardOutputContent \
                --output text | tail -80
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --output json
              exit 1
            fi
            sleep 15
          done
          echo "SSM wait timed out"
          exit 1

      - name: Verify paper #676 flags on public API
        run: |
          set -euo pipefail
          EXPECTED=$(git rev-parse --short HEAD)
          API="${{ env.PUBLIC_API_URL }}"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf --connect-timeout 5 --max-time 20 \
              "$API/api/deployment/status" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          f = d.get('flags') or {}
          commit = str(d.get('commit') or '')
          print(json.dumps({
              'commit': commit,
              'paperTrading': f.get('paperTrading'),
              'enableLiveTrading': f.get('enableLiveTrading'),
              'paper676EntryChoke': f.get('paper676EntryChoke'),
              'entryEarliestIst': f.get('entryEarliestIst'),
              'liveBestTradesOnlyEnabled': f.get('liveBestTradesOnlyEnabled'),
          }, indent=2))
          if d.get('status') != 'ok':
              raise SystemExit('status not ok')
          if commit != '$EXPECTED':
              raise SystemExit(f'commit mismatch: {commit!r} != $EXPECTED!r')
          if f.get('paperTrading') is not True:
              raise SystemExit('paperTrading must be true')
          if f.get('enableLiveTrading') is not False:
              raise SystemExit('enableLiveTrading must be false')
          if f.get('paper676EntryChoke') is not True:
              raise SystemExit('paper676EntryChoke must be true')
          if f.get('entryEarliestIst') != '09:20':
              raise SystemExit('entryEarliestIst must be 09:20 after overlay')
          if f.get('openSideConfirmationStartIst') != '09:25':
              raise SystemExit('openSideConfirmationStartIst must be 09:25 after overlay')
          if f.get('liveBestTradesOnlyEnabled') is not False:
              raise SystemExit('liveBestTradesOnlyEnabled must be false on --paper')
          "; then
              exit 0
            fi
            echo "verify attempt $i failed — waiting"
            sleep 10
          done
          curl -sf --max-time 20 "$API/api/deployment/status" | python3 -m json.tool
          exit 1
