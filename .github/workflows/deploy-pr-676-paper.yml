name: Deploy PR 676 paper

# Checks out the merged PR #676 commit on EC2 and forces paper mode.
# Does not move main. Dispatch this workflow; it deploys cursor/pr-676-sha-3b1b.
on:
  workflow_dispatch:

concurrency:
  group: deploy-pr-676-paper
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b
  PUBLIC_API_URL: https://api.jashuvatrade.xyz
  DEPLOY_BRANCH: cursor/pr-676-sha-3b1b
  DEPLOY_SHA: 739fee8

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verify GitHub AWS secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy PR 676 commit in paper mode
        id: deploy
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1800 \
            --comment "Deploy PR 676 ${{ env.DEPLOY_SHA }} paper" \
            --parameters 'commands=[
              "set -euo pipefail",
              "export HOME=/root",
              "export GIT_CONFIG_GLOBAL=/root/.gitconfig",
              "git config --global --add safe.directory /opt/nexusquant/New-idea",
              "cd /opt/nexusquant/New-idea",
              "git fetch origin cursor/pr-676-sha-3b1b",
              "git checkout -B cursor/pr-676-sha-3b1b origin/cursor/pr-676-sha-3b1b",
              "git reset --hard origin/cursor/pr-676-sha-3b1b",
              "ENV=/opt/nexusquant/env",
              "touch $ENV",
              "set_key() { k=\"$1\"; v=\"$2\"; if grep -q \"^${k}=\" \"$ENV\"; then sed -i \"s|^${k}=.*|${k}=${v}|\" \"$ENV\"; else echo \"${k}=${v}\" >> \"$ENV\"; fi; echo \"set ${k}=${v}\"; }",
              "set_key ENABLE_LIVE_TRADING false",
              "set_key PAPER_TRADING true",
              "set_key PAPER_SLIPPAGE_ENABLED true",
              "set_key PAPER_SIMULATE_BROKER_ORDERS true",
              "BRANCH=cursor/pr-676-sha-3b1b bash deploy/ec2-update.sh",
              "set_key ENABLE_LIVE_TRADING false",
              "set_key PAPER_TRADING true",
              "set_key PAPER_SLIPPAGE_ENABLED true",
              "set_key PAPER_SIMULATE_BROKER_ORDERS true",
              "docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps backend",
              "echo DEPLOYED $(git rev-parse --short HEAD)"
            ]' \
            --query Command.CommandId \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for SSM command
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.deploy.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query StandardOutputContent \
                --output text | tail -80
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --output json
              exit 1
            fi
            sleep 15
          done
          echo "SSM wait timed out"
          exit 1

      - name: Verify paper and PR 676 commit
        run: |
          set -euo pipefail
          API="${{ env.PUBLIC_API_URL }}"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf --connect-timeout 5 --max-time 20 \
              "$API/api/deployment/status" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          f = d.get('flags') or {}
          commit = str(d.get('commit') or '')
          paper = bool(f.get('paperTrading'))
          live = bool(f.get('enableLiveTrading'))
          print({'commit': commit, 'paperTrading': paper, 'enableLiveTrading': live})
          if d.get('status') != 'ok':
              raise SystemExit('status not ok')
          if not commit.startswith('${{ env.DEPLOY_SHA }}'):
              raise SystemExit('commit is not PR 676')
          if not paper or live:
              raise SystemExit('paper mode is not on')
          "; then
              exit 0
            fi
            echo "verify attempt $i failed — waiting"
            sleep 10
          done
          curl -sf --max-time 20 "$API/api/deployment/status" | python3 -m json.tool
          exit 1
