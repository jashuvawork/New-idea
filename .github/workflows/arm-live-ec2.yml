name: Arm Live EC2

on:
  workflow_dispatch:
    inputs:
      capital_inr:
        description: Live capital ceiling (INR)
        required: false
        default: "10000"

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b

jobs:
  arm-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Arm live on EC2 via SSM
        id: arm
        run: |
          set -euo pipefail
          CAP="${{ inputs.capital_inr }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Arm live execution capital=${CAP}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"REPO=/opt/nexusquant/New-idea\",
              \"cd \\\$REPO\",
              \"git fetch origin main\",
              \"git checkout main\",
              \"git pull --ff-only origin main || git reset --hard origin/main\",
              \"curl -sf -X POST http://127.0.0.1:8000/api/execution/stop || true\",
              \"curl -sf -X POST http://127.0.0.1:8000/api/auto-trader/purge-logs || true\",
              \"sudo bash deploy/go-live-10k-monday.sh --arm-live\",
              \"curl -sf http://127.0.0.1:8000/api/deployment/status | python3 -m json.tool | head -40\",
              \"curl -sf -X POST http://127.0.0.1:8000/api/execution/resume || true\"
            ]" \
            --query Command.CommandId \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for arm-live
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.arm.outputs.command_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query StandardOutputContent \
                --output text | tail -60
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --output json
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify public live flag
        run: |
          set -euo pipefail
          curl -sf https://www.jashuvatrade.xyz/api/deployment/status | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          f = d.get('flags') or {}
          live = bool(f.get('enableLiveTrading'))
          paper = bool(f.get('paperTrading'))
          print('enableLiveTrading:', live)
          print('paperTrading:', paper)
          print('fallbackCapitalInr:', f.get('fallbackCapitalInr'))
          if not live or paper:
              raise SystemExit('Live not armed on public API')
          "
