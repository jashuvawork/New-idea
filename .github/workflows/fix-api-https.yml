name: Fix API HTTPS on EC2

# Repairs api.jashuvatrade.xyz nginx + Let's Encrypt on the live EC2 box.
# Prerequisite: DNS A-record api.jashuvatrade.xyz → current EIP (65.0.136.146).

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b

jobs:
  fix-https:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull latest fix script and run via SSM
        id: fix
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Fix api.jashuvatrade.xyz HTTPS/nginx" \
            --timeout-seconds 900 \
            --parameters 'commands=[
              "set -euo pipefail",
              "export HOME=/root",
              "git config --global --add safe.directory /opt/nexusquant/New-idea || true",
              "cd /opt/nexusquant/New-idea",
              "git fetch origin main",
              "git checkout main",
              "git pull --ff-only origin main || git reset --hard origin/main",
              "chmod +x deploy/fix-api-https.sh",
              "bash deploy/fix-api-https.sh"
            ]' \
            --query Command.CommandId \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for SSM
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.fix.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query StandardOutputContent \
                --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --output json
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify public endpoints
        run: |
          set -euo pipefail
          echo "DNS: $(dig +short api.jashuvatrade.xyz @8.8.8.8 | head -1)"
          curl -sf --max-time 20 http://65.0.136.146:8000/health
          echo
          curl -sf --max-time 20 https://www.jashuvatrade.xyz/api/deployment/status | head -c 300
          echo
          curl -sfk --max-time 20 https://api.jashuvatrade.xyz/health || curl -sf --max-time 20 http://api.jashuvatrade.xyz/health
          echo
