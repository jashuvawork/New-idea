name: Sep 2 lever replay compare on EC2

on:
  workflow_dispatch:
    inputs:
      date:
        description: Session date (YYYY-MM-DD)
        required: true
        default: "2026-09-02"
      start:
        description: IST window start (empty = full session)
        required: false
        default: ""
      end:
        description: IST window end (empty = full session)
        required: false
        default: ""
      side:
        description: CALL, PUT, or empty for both
        required: false
        default: ""
      branch:
        description: Git branch to run
        required: true
        default: "main"

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run lever compare on EC2 via SSM
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.date }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          SIDE="${{ github.event.inputs.side }}"
          BRANCH="${{ github.event.inputs.branch }}"
          START_ARG=""
          END_ARG=""
          SIDE_ARG=""
          if [ -n "$START" ]; then START_ARG=", start='${START}'"; fi
          if [ -n "$END" ]; then END_ARG=", end='${END}'"; fi
          if [ -n "$SIDE" ]; then SIDE_ARG=", side='${SIDE}'"; fi
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Lever replay compare ${DATE}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"export HOME=/root\",
              \"git config --global --add safe.directory /opt/nexusquant/New-idea\",
              \"cd /opt/nexusquant/New-idea\",
              \"git fetch origin ${BRANCH}\",
              \"git checkout ${BRANCH}\",
              \"cd backend\",
              \"export TRADE_STORE_DIR=/opt/nexusquant/data/trades\",
              \"export RADAR_ARCHIVE_DIR=/opt/nexusquant/data/trades/radar_archives\",
              \".venv/bin/python - <<'PY'\",
              \"import json\",
              \"from app.engines.eod_local_base_replay import generate_lever_replay_compare\",
              \"rep = generate_lever_replay_compare('${DATE}'${START_ARG}${END_ARG}${SIDE_ARG})\",
              \"print(json.dumps(rep, indent=2, default=str))\",
              \"PY\"
            ]" \
            --query Command.CommandId \
            --output text)
          echo "Waiting for command $CMD_ID..."
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS (attempt $i)"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --output text \
            --query '[Status, StandardOutputContent, StandardErrorContent]'
