name: Paper before open 2026-10-27

# One-shot safety net: 03:35 UTC = 09:05 IST before NSE open (Oct 27, 2026).
# Primary disarm: push to main with [disarm-paper] in the commit message.

on:
  schedule:
    - cron: "35 3 27 10 *"
  workflow_dispatch:

concurrency:
  group: disarm-paper-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b

jobs:
  paper-preopen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set paper via SSM
        id: paper
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Paper before 2026-10-27 open" \
            --parameters 'commands=[
              "set -euo pipefail",
              "REPO=/opt/nexusquant/New-idea",
              "cd $REPO",
              "git fetch origin main",
              "git checkout main",
              "git pull --ff-only origin main || git reset --hard origin/main",
              "sudo bash deploy/set-execution-mode.sh --paper",
              "curl -sf http://127.0.0.1:8000/api/deployment/status -o /tmp/nq-deploy-status.json",
              "python3 -m json.tool /tmp/nq-deploy-status.json | head -40 || true"
            ]' \
            --query Command.CommandId \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for paper switch
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.paper.outputs.command_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query StandardOutputContent \
                --output text | tail -40
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --output json
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify paper mode
        run: |
          set -euo pipefail
          curl -sf https://www.jashuvatrade.xyz/api/deployment/status | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          f = d.get('flags') or {}
          live = bool(f.get('enableLiveTrading'))
          paper = bool(f.get('paperTrading'))
          print('enableLiveTrading:', live)
          print('paperTrading:', paper)
          if live or not paper:
              raise SystemExit('Not in paper mode on public API')
          "
