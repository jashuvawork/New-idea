name: Set Day Capital EC2

on:
  workflow_dispatch:
    inputs:
      capital_inr:
        description: Today's capital (INR, ≥ 45000) — sizing and risk limits fit to it
        required: true
        default: "100000"

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b

jobs:
  set-capital:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set capital on EC2 via SSM
        id: cap
        run: |
          set -euo pipefail
          CAP="${{ inputs.capital_inr }}"
          if ! [[ "$CAP" =~ ^[0-9]+$ ]] || [ "$CAP" -lt 45000 ]; then
            echo "capital_inr must be a whole rupee amount ≥ 45000 (got '${CAP}')" >&2
            exit 1
          fi
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Set day capital=${CAP}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd /opt/nexusquant/New-idea\",
              \"sudo bash deploy/set-day-capital.sh ${CAP}\"
            ]" \
            --query Command.CommandId \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for result
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.cap.outputs.command_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text | tail -40
              [ "$STATUS" = "Success" ] && exit 0 || exit 1
            fi
            sleep 5
          done
          exit 1
