name: Disarm to paper on push

# Runs when a push to main includes [disarm-paper] in the commit message.
# Flips ENABLE_LIVE_TRADING=false + PAPER_TRADING=true and restarts backend.

on:
  push:
    branches: [main]

concurrency:
  group: disarm-paper-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0f3f9e5e67815c21b

jobs:
  disarm-paper:
    if: contains(github.event.head_commit.message, '[disarm-paper]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Disarm to paper via SSM
        id: disarm
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Disarm live trading (push trigger)" \
            --parameters 'commands=[
              "set -euo pipefail",
              "REPO=/opt/nexusquant/New-idea",
              "cd $REPO",
              "git fetch origin main",
              "git checkout main",
              "git pull --ff-only origin main || git reset --hard origin/main",
              "if grep -q 'MODE=paper' deploy/go-live-10k-monday.sh 2>/dev/null; then",
              "  sudo bash deploy/go-live-10k-monday.sh --paper",
              "else",
              "  curl -sf -X POST http://127.0.0.1:8000/api/execution/stop || true",
              "  ENV=/opt/nexusquant/env",
              "  touch $ENV",
              "  for kv in ENABLE_LIVE_TRADING=false PAPER_TRADING=true PAPER_SLIPPAGE_ENABLED=true PAPER_SIMULATE_BROKER_ORDERS=true SHADOW_TRADE_ALL_SIGNALS=true; do",
              "    k=${kv%%=*}; v=${kv#*=}",
              "    if grep -q \"^${k}=\" $ENV; then sed -i \"s|^${k}=.*|${k}=${v}|\" $ENV; else echo ${k}=${v} >> $ENV; fi",
              "  done",
              "  docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps backend",
              "  sleep 6",
              "  curl -sf -X POST http://127.0.0.1:8000/api/execution/resume || true",
              "fi",
              "curl -sf http://127.0.0.1:8000/api/deployment/status | python3 -m json.tool | head -40"
            ]' \
            --query Command.CommandId \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for disarm
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.disarm.outputs.command_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query StandardOutputContent \
                --output text | tail -80
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --output json
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify paper mode
        run: |
          set -euo pipefail
          curl -sf https://www.jashuvatrade.xyz/api/deployment/status | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          f = d.get('flags') or {}
          live = bool(f.get('enableLiveTrading'))
          paper = bool(f.get('paperTrading'))
          print('enableLiveTrading:', live)
          print('paperTrading:', paper)
          if live or not paper:
              raise SystemExit('Still in live mode on public API')
          "
